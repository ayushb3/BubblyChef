[project]
name = "bubbly-chef-ai"
version = "1.0.0"
description = "BubblyChef AI Microservice — chat, recipes, OCR"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "supabase>=2.0",
    "python-jose[cryptography]>=3.3",
    "google-generativeai>=0.8",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "pytesseract>=0.3",
    "Pillow>=10.0",
    "rapidfuzz>=3.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "recipe-scrapers>=15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
