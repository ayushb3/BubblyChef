name: Claude PR review

# The independent reviewer in WORKFLOW.md §7. It runs in a fresh context that never
# saw the session that wrote the code, and reads only the diff, the PR body and the
# linked issue. That separation is the point: a reviewer sharing the author's context
# shares its blind spots.
#
# Review-only by construction: the tool list below has no Edit, Write, git or push,
# so this job cannot change the code it is reviewing, only comment on it.
#
# Kill switch: set the repo variable AGENTS_ENABLED to anything but "true" and this
# stops firing (docs/WORKFLOW.md, "If the agents need stopping").
#
# The `verdict` job ("Claude review verdict") turns the review into a merge gate for
# PRs labelled `agent-loop`: it passes only on "looks mergeable" for the exact head
# commit, or on Ayush's approval of that commit. It is a required check on main,
# which is what lets the agent loop request auto-merge on a small PR without waiting
# for this review itself. Other PRs pass it straight through; whoever merges them
# reads the verdict first (WORKFLOW.md §6).

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
  # Only re-evaluates the verdict gate (Ayush's approval clears a hold). The
  # review itself never runs on this event.
  pull_request_review:
    types: [submitted]

# Separate groups per event, so an approval arriving mid-review doesn't cancel the review.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts are work in progress; review fires when the PR is marked ready.
    # New pushes (synchronize) are re-reviewed on PRs labelled `agent-loop`, OR on any
    # PR opened by bubblychef-bot (labelled or not): the agent loop's Respond stage
    # fixes the review's findings and pushes, and needs a fresh review of the new
    # commit to know whether it worked. The bot-author clause is what lets a bot PR get
    # re-reviewed on every push even before the loop label lands on it (or when the
    # loop never applies the label at all), retiring the old close-and-reopen
    # workaround that faked a "reopened" event to force a re-review. It does NOT put
    # such a PR under the `verdict` job's blocking gate or the loop's own round cap —
    # both key off the `agent-loop` label alone (see review-verdict.cjs), so an
    # unlabelled bot PR is reviewed again but never held by this workflow. Human PRs
    # (not authored by bubblychef-bot, unlabelled) are still reviewed once, on open.
    if: >-
      github.event_name == 'pull_request'
      && vars.AGENTS_ENABLED == 'true'
      && github.event.pull_request.draft == false
      && (github.event.action != 'synchronize'
          || contains(github.event.pull_request.labels.*.name, 'agent-loop')
          || github.event.pull_request.user.login == 'bubblychef-bot')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      actions: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the step below can inspect the pushed commit's parents.
          fetch-depth: 0

      # "Update branch" pushes only merge the base branch into the PR. They don't
      # change what the PR does, so they don't need a fresh Opus review, and CI
      # still runs on them. A merge carrying conflict-resolution edits is NOT
      # skipped: `git show --cc` prints those edits, and a clean merge prints nothing.
      - name: Skip the re-review when the push only merged the base branch
        id: baseonly
        if: github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -eu
          read -r _ p1 p2 extra <<<"$(git rev-list --parents -n1 "$AFTER")"
          if [ -n "${p2:-}" ] && [ -z "${extra:-}" ] && [ "$p1" = "$BEFORE" ]              && git merge-base --is-ancestor "$p2" "origin/$BASE"              && [ -z "$(git show --format= --cc "$AFTER")" ]; then
            # Keeping the existing review is only sound if the commit being merged INTO
            # was itself reviewed (or inherited a review the same way). A real push
            # whose review run was cancelled by a quick follow-up push (cancel-in-progress
            # above) was never reviewed, and a review job can also conclude `success`
            # without posting anything (the action skips PRs that edit this workflow, and
            # may run out of turns). So "reviewed" means: a `review` job for $BEFORE
            # succeeded AND either a claude[bot] verdict comment was updated after that
            # job started, or $BEFORE itself inherited its review through this step.
            # Fail open: if any API call fails or nothing matches, the review runs.
            # The run's own conclusion is not checked: the verdict job fails it
            # whenever an agent-loop verdict holds, which says nothing about the review.
            reviewed=0
            for run_id in $(gh api "repos/$REPO/actions/workflows/claude-review.yml/runs?head_sha=$BEFORE&event=pull_request&per_page=50" --jq '.workflow_runs[].id' || true); do
              # "<started_at> <conclusion of the Claude review step>" for a successful review job.
              job=$(gh api "repos/$REPO/actions/runs/$run_id/jobs" --jq '[.jobs[] | select(.name == "review" and .conclusion == "success") | "\(.started_at) \([.steps[] | select(.name == "Claude review") | .conclusion] | .[0] // "none")"] | .[0] // empty' || true)
              [ -n "${job:-}" ] || continue
              read -r started step <<<"$job"
              # The Claude step skipped means $BEFORE was itself a base-only merge that
              # inherited its review through this same check: the chain stays valid.
              if [ "$step" = skipped ]; then reviewed=1; break; fi
              posted=$(gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" --jq ".[] | select(.user.login == \"claude[bot]\" and (.body | contains(\"<!-- verdict:\")) and .updated_at >= \"$started\") | .id" || true)
              if [ -n "${posted:-}" ]; then reviewed=1; break; fi
            done
            if [ "$reviewed" = 1 ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Push only merged $BASE into the branch with no conflict edits; keeping the existing review."
            else
              echo "Push only merged $BASE, but the previous head ${BEFORE:0:8} has no completed review (cancelled or never ran); reviewing this commit."
            fi
          fi

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        if: steps.baseonly.outputs.skip != 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the independent reviewer for BubblyChef. You did not write this
            change and have not seen the session that did. Review it as someone who
            has to decide whether it can merge without a human reading the diff:
            an agent merges on your verdict.

            Read CLAUDE.md first. It holds this repo's standards. Consult WORKFLOW.md
            only if you need a specific rule.

            BUDGET: you have a limited number of turns, and running out means NO review
            is posted at all. Work from `gh pr diff`, and use Grep or a targeted Read
            (with line ranges) only to check a specific suspicion. Don't read whole large
            files or wander the codebase. Post the summary comment well before you run low.

            Then:
            1. Read the PR body and any issue it closes (`gh issue view`). The PR
               body is the review surface here. Check it says what changed in
               behavioural terms, what was actually verified and how, and what is
               explicitly NOT covered. A missing gap statement is a finding.
            2. Read the diff (`gh pr diff`). Look for, in priority order:
               - Behaviour that does not match what the issue or PR body claims.
               - Bugs: wrong logic, unhandled errors, broken edge cases, anything
                 that typechecks and passes tests but is wrong.
               - Security: auth bypass, missing requireAuth() on an API route,
                 secrets, user data crossing users (RLS), injection.
               - Tests that do not actually test the change, or assert what the new
                 code happens to do rather than what it should do.
               - Violations of CLAUDE.md's Dev Guidelines.
            3. If the PR changes CI, the gates or agent config (.github/,
               .claude/settings.json, .claude/hooks/, .claude/agents/,
               .claude/workflows/, scripts/agent-gates/, scripts/merge/), say so at
               the top of your summary: the rules themselves are changing.
               If the PR deletes, renames or skips any test, list each one and say
               whether the reason given holds. An unexplained removal is a finding.
            4. If this is a re-review (the PR already has your earlier review and a
               resolutions comment from bubblychef-bot saying "fixed" or "disputed" per
               finding): check each "fixed" is genuinely fixed in the current diff, and
               accept a "disputed" only if you agree with the reason. Raise any finding
               again if it isn't resolved. Then review the new changes as normal.

            Post inline comments only for concrete, specific problems, one per issue,
            each saying what is wrong and why it matters. Do not comment on style
            the linters already enforce, and do not praise.

            Finish with one summary comment:
            - **Verdict:** `looks mergeable`, `needs changes`, or `needs a human`
              (something you could not verify, or a change to v1 scope or to
              anything that costs money).
              `looks mergeable` means an agent may merge this with no human ever
              reading it. If the change alters behaviour a user would notice
              beyond what the issue describes, name that change first. It can
              still be `looks mergeable` if the PR body records it as a product
              call with the alternative considered; unrecorded, it is
              `needs changes`. Never write "looks mergeable" together with
              "the human should accept/confirm/decide …"; that combination is
              `needs a human`.
              Write the verdict as a literal line `**Verdict: `<one of the three>`**`
              in EVERY summary, including a re-review. A heading such as
              "## Re-review (round 3) — `looks mergeable`" is fine as a title, but it
              does not replace that line, and the two must agree.
            - The findings that drove the verdict, most severe first, one line each.
            - Anything you could not check.
            Keep it short enough to read on a phone.

            End the whole comment with exactly one machine-readable line, on its own
            line, after everything else — an HTML comment so it renders invisibly:
            `<!-- verdict: looks-mergeable -->`, `<!-- verdict: needs-changes -->`, or
            `<!-- verdict: needs-human -->`, matching the human-readable Verdict line
            above it exactly (mergeable/changes/human). Do not add any other text on
            that line, and do not emit more than one such line.
          claude_args: |
            --model claude-opus-5
            --max-turns 60
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*),Read,Grep,Glob"

  # The merge gate. `if: always()` and nothing else: a SKIPPED required check counts as
  # passing, so this job must run and decide on every event, even when the review above
  # was skipped (kill switch off, draft) — for an agent-loop PR that decision is "hold".
  verdict:
    name: Claude review verdict
    needs: review
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    steps:
      # The gate script comes from the BASE commit, so a PR can't loosen the check
      # that gates it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          if [ ! -f scripts/agent-gates/review-verdict.cjs ]; then
            # Only while the PR that introduces the gate is open: base has no script yet.
            if gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name' | grep -qx agent-loop; then
              echo "::error::No gate script on the base commit; holding this agent-loop PR."
              exit 1
            fi
            echo "No gate script on the base commit; not an agent-loop PR, so not gated."
            exit 0
          fi
          node scripts/agent-gates/review-verdict.cjs "$REPO" "$PR" "$HEAD_SHA"
