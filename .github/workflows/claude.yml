name: Claude (@claude mentions)

# On-demand Claude, from anywhere GitHub lets you comment, including GitHub mobile:
# "@claude why did the fail-to-pass check fail here?", "@claude re-review this".
#
# Only accounts with write access can trigger it (the action's default), which on a
# public repo is what keeps strangers' comments from spending the subscription or
# steering an agent that can push. Do not add allowed_non_write_users.
#
# Kill switch: set the repo variable AGENTS_ENABLED to anything but "true".

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      vars.AGENTS_ENABLED == 'true' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude"
          claude_args: |
            --model claude-opus-5
            --max-turns 40
