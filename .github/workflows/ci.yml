name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Next.js ──────────────────────────────────────────────────────────────
  nextjs:
    name: Next.js (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nextjs/package-lock.json

      - run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Jest
        run: npm test -- --ci

  # ── Next.js e2e (Playwright smoke) ────────────────────────────────────────
  nextjs-e2e:
    name: Next.js (e2e smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nextjs/package-lock.json

      - run: npm ci

      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install --with-deps chromium

      # Deliberately references NO repo secret. The `smoke` project boots its
      # own local dev server (see playwright.config.ts webServer) and never
      # touches the deployed Vercel site or a real Supabase project — these
      # are obvious placeholders, not credentials, needed only because the
      # app's middleware constructs a Supabase client on every request and
      # crashes on undefined values. Playwright.config.ts already falls back
      # to the same placeholders on its own, so this env block is redundant
      # but kept for visibility/documentation.
      - name: Playwright smoke suite (no credentials)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder-project.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-e2e-smoke-tests-only
        run: npx playwright test --project=smoke

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: nextjs/e2e/.report/
          retention-days: 14

      # ── Follow-up (not enabled yet) ─────────────────────────────────────
      # Once the repo owner adds a real Supabase test project + test account,
      # enable the `authenticated` project (logged-in navigation) by adding
      # these repo secrets and uncommenting the step below:
      #   TEST_USERNAME                    — email of a Supabase test user
      #   TEST_PASSWORD                    — that user's password
      #   NEXT_PUBLIC_SUPABASE_URL         — real project URL
      #   NEXT_PUBLIC_SUPABASE_ANON_KEY    — real anon key
      #
      # - name: Playwright authenticated suite
      #   env:
      #     TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      #     TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      #     NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      #     NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      #   run: npx playwright test --project=authenticated

  # ── AI service ───────────────────────────────────────────────────────────
  ai-service:
    name: AI service (lint + typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check bubbly_chef/

      - name: Mypy
        run: mypy bubbly_chef/ --strict

      - name: Pytest
        run: pytest tests/ -x -q

  # ── AI service live tests ─────────────────────────────────────────────────
  ai-service-live:
    name: AI service (live intent tests)
    runs-on: ubuntu-latest
    # Only run on push to main — not on PRs (avoids burning API quota)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Non-blocking: Gemini can be intermittently flaky
    continue-on-error: true
    defaults:
      run:
        working-directory: ai-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Live intent tests
        env:
          BUBBLY_GEMINI_API_KEY: ${{ secrets.BUBBLY_GEMINI_API_KEY }}
          BUBBLY_RUN_LIVE_TESTS: "1"
        run: pytest tests/test_intent_live.py -v
