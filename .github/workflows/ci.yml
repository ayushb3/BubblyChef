name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Next.js ──────────────────────────────────────────────────────────────
  nextjs:
    name: Next.js (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nextjs/package-lock.json

      - run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Jest
        run: npm test -- --ci

  # ── AI service ───────────────────────────────────────────────────────────
  ai-service:
    name: AI service (lint + typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check bubbly_chef/

      - name: Pytest
        run: pytest tests/ -x -q

  # ── AI service live tests ─────────────────────────────────────────────────
  ai-service-live:
    name: AI service (live intent tests)
    runs-on: ubuntu-latest
    # Only run on push to main — not on PRs (avoids burning API quota)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Non-blocking: Gemini can be intermittently flaky
    continue-on-error: true
    defaults:
      run:
        working-directory: ai-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Live intent tests
        env:
          BUBBLY_GEMINI_API_KEY: ${{ secrets.BUBBLY_GEMINI_API_KEY }}
          BUBBLY_RUN_LIVE_TESTS: "1"
        run: pytest tests/test_intent_live.py -v
