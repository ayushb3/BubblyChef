name: CI

on:
  push:
    branches: [main]
  # Deliberately unfiltered by base branch. A `branches: [main]` filter here means
  # any PR targeting a long-lived feature branch gets zero checks — that is how
  # #119, #120 and #121 all reached review having never been typechecked or tested.
  # Stacked PRs need the same gate as PRs to main.
  pull_request:

jobs:
  # ── Next.js ──────────────────────────────────────────────────────────────
  nextjs:
    name: Next.js (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nextjs/package-lock.json

      - run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      # Without this gate the error count drifts upward unnoticed — it had reached
      # 8 before anyone looked (#149). Warnings stay non-fatal; errors fail the build.
      - name: ESLint
        run: npx eslint src/ --max-warnings=-1

      - name: Jest
        run: npm test -- --ci

  # ── AI service ───────────────────────────────────────────────────────────
  ai-service:
    name: AI service (lint + typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check bubbly_chef/

      - name: Pytest
        run: pytest tests/ -x -q

  # ── AI service live tests ─────────────────────────────────────────────────
  ai-service-live:
    name: AI service (live intent tests)
    runs-on: ubuntu-latest
    # Only run on push to main — not on PRs (avoids burning API quota)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Non-blocking: Gemini can be intermittently flaky
    continue-on-error: true
    defaults:
      run:
        working-directory: ai-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Live intent tests
        env:
          BUBBLY_GEMINI_API_KEY: ${{ secrets.BUBBLY_GEMINI_API_KEY }}
          BUBBLY_RUN_LIVE_TESTS: "1"
        run: pytest tests/test_intent_live.py -v

  # ── Demo media budget ────────────────────────────────────────────────────
  # PR evidence screenshots land in docs/media/ and are never deleted by the
  # session that adds them, so the directory only grows. Images are permanent
  # in git history — deleting them later frees the working tree but not the
  # repo — so the cheap moment to catch bloat is before it merges.
  #
  # This job reports; it does not fail the build. A PR blocked because its own
  # evidence pushed the total over a line would push agents toward attaching
  # less evidence, which is the opposite of what §4 wants. It fails only on a
  # single oversized file, which is always a mistake (an unresized retina
  # capture or a video), never a judgment call.
  media-budget:
    name: Demo media budget
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Report size, flag staleness, fail on oversized files
        run: bash scripts/check-media-budget.sh
